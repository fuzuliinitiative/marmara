# LibreWolf'un yeni sürümünü izler; Marmara'yı onunla yeniden derler.
#
#  - En son release'in notundaki "librewolf: <sürüm>" satırı en son LibreWolf'la
#    aynıysa hiçbir şey yapmaz.
#  - Yeniyse Marmara'yı derler, bir sonraki sürüm numarasıyla (1.0 → 1.0.1)
#    release açar ve Linux arşivini ekler. Depoya geri yazmaz.
#  - Marmara'nın kendi kodu (modules, theme, l10n, scripts, config…) main'e gönderilince
#    de LibreWolf aynı olsa bile yeni sürüm yayımlar (elle çalıştırmaya gerek kalmaz).
#  - Yamalar yeni Firefox yapısıyla uyuşmazsa "LibreWolf <sürüm> ile derleme
#    başarısız" issue'su açar.
#
# Bu dosya GitHub'da .github/workflows/ altında durmalı.

name: LibreWolf güncellemesi

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - addons/**
      - branding/**
      - builtin/**
      - config/**
      - l10n/**
      - modules/**
      - scripts/**
      - settings/**
      - startpage/**
      - theme/**
      - build.sh
  workflow_dispatch:
    inputs:
      force:
        description: "LibreWolf aynı olsa da yeni bir Marmara sürümü yayımla (örn. kendi değişikliklerimiz için)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# Aynı anda iki sürüm numarası üretilmesin
concurrency:
  group: marmara-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outcome == 'success' }}
      marmara: ${{ steps.version.outputs.marmara }}
      tag: ${{ steps.latest.outputs.tag }}
      windows_url: ${{ steps.latest.outputs.windows_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: En son LibreWolf sürümünü bul
        id: latest
        run: python3 scripts/latest-librewolf.py | tee -a "$GITHUB_OUTPUT"

      - name: Bu sürüm zaten yayımlandı mı?
        id: check
        run: |
          tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          notes=""
          [ -n "$tag" ] && notes="$(gh release view "$tag" --json body --jq .body)"
          if [ "${{ github.event.inputs.force }}" != "true" ] && [ "${{ github.event_name }}" != "push" ] && printf '%s\n' "$notes" | grep -qx "librewolf: ${{ steps.latest.outputs.tag }}"; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerekli araçlar
        if: steps.check.outputs.new == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 unzip zip xz-utils

      - name: LibreWolf'u indir
        if: steps.check.outputs.new == 'true'
        run: curl -fL --retry 3 -o librewolf.tar.xz "${{ steps.latest.outputs.url }}"

      - name: Sürüm numarasını belirle
        id: version
        if: steps.check.outputs.new == 'true'
        run: |
          new="$(python3 scripts/next-version.py VERSION "${{ steps.check.outputs.tag }}")"
          scripts/bump-version.sh "$new"
          echo "marmara=$new" >> "$GITHUB_OUTPUT"

      - name: Marmara'yı derle
        id: build
        if: steps.check.outputs.new == 'true'
        run: ./build.sh librewolf.tar.xz --tarball --offline

      - name: Release aç
        id: release
        if: steps.check.outputs.new == 'true' && steps.build.outcome == 'success'
        env:
          LW: ${{ steps.latest.outputs.version }}
          TAG: ${{ steps.latest.outputs.tag }}
          NEW: ${{ steps.version.outputs.marmara }}
        run: |
          file="marmara-$NEW-linux-x86_64.tar.xz"
          cp dist/marmara-*-linux-x86_64.tar.xz "$file"
          printf 'LibreWolf %s üzerine otomatik derlendi.\n\nlibrewolf: %s\n' "$TAG" "$TAG" > notes.md
          gh release create "v$NEW" "$file" --title "Marmara $NEW" --notes-file notes.md

      - name: Derleme başarısızsa issue aç
        if: failure() && steps.build.outcome == 'failure'
        env:
          LW: ${{ steps.latest.outputs.tag }}
        run: |
          title="LibreWolf $LW ile derleme başarısız"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[]')" ]; then
            gh issue create --title "$title" \
              --body "Otomatik derleme başarısız oldu; yamalar yeni Firefox yapısıyla uyuşmuyor olabilir. Ayrıntı: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

  # Windows paketi: Linux sürümü ve release zaten yayımlandıktan sonra çalışır.
  # Başarısız olursa Linux sürümü ve Flatpak etkilenmez; yalnızca Windows dosyası
  # release'e eklenmez (çalıştırma kırmızı görünür).
  windows:
    needs: update
    timeout-minutes: 20
    if: needs.update.outputs.released == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Gerekli araçlar
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends python3 unzip zip gcc-mingw-w64-x86-64

      - name: LibreWolf Windows paketini indir
        run: curl -fL --retry 3 -o librewolf-win.zip "${{ needs.update.outputs.windows_url }}"

      - name: Sürüm numarasını ayarla
        run: scripts/bump-version.sh "${{ needs.update.outputs.marmara }}"

      - name: Marmara'yı Windows için derle
        run: ./build.sh librewolf-win.zip --tarball --offline

      - name: Paketi sakla
        uses: actions/upload-artifact@v4
        with:
          name: marmara-windows
          path: dist/marmara-*-windows-x86_64.zip
          if-no-files-found: error

  windows-test:
    needs: [update, windows]
    timeout-minutes: 15
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: marmara-windows

      - name: Aç
        shell: pwsh
        run: |
          $zip = Get-ChildItem marmara-*-windows-x86_64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath app

      - name: Simge ve ürün adını marmara-bin.exe'ye göm
        shell: pwsh
        run: |
          # LibreWolf'un exe'si kendi simgesini ve "LibreWolf" adını taşır; görev çubuğunda
          # görünen simge ve ad buradan gelir.
          $dir = (Resolve-Path app/marmara).Path
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile rcedit.exe
          .\rcedit.exe "$dir\marmara-bin.exe" `
            --set-icon "$dir\marmara.ico" `
            --set-version-string FileDescription Marmara `
            --set-version-string ProductName Marmara `
            --set-version-string InternalName Marmara `
            --set-version-string CompanyName "Fuzuli Initiative" `
            --set-version-string OriginalFilename marmara-bin.exe
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::rcedit başarısız"; exit 1 }
          Remove-Item "$dir\marmara.ico"

      - name: Yeniden paketle
        shell: pwsh
        run: |
          $name = (Get-ChildItem marmara-*-windows-x86_64.zip | Select-Object -First 1).Name
          Remove-Item $name
          7z a -tzip -mx=5 $name app\marmara | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::7z başarısız"; exit 1 }

      - name: Başlat ve dene
        shell: pwsh
        run: |
          $dir = (Resolve-Path app/marmara).Path
          Get-ChildItem $dir | Select-Object -First 80 | Format-Table Name, Length | Out-String | Write-Host
          $profile_dir = Join-Path $env:RUNNER_TEMP "marmara-profile"
          New-Item -ItemType Directory -Force $profile_dir | Out-Null
          # Başlatıcıyı atlayıp doğrudan -app ile çalıştır: açılıyor mu, çöküyor mu?
          $p = Start-Process -FilePath "$dir\marmara-bin.exe" `
            -ArgumentList @("-app", "$dir\browser\application.ini", "--headless", "-no-remote", "-profile", $profile_dir) `
            -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            Write-Host "::error::Marmara başlangıçta kapandı (çıkış kodu $($p.ExitCode))"
            exit 1
          }
          Write-Host "Marmara 25 saniye sonra hâlâ çalışıyor."
          Get-ChildItem $profile_dir | Select-Object Name | Out-String | Write-Host
          if (-not (Test-Path "$profile_dir\prefs.js")) {
            Write-Host "::error::Profil oluşmadı (prefs.js yok)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force

      - name: Başlatıcı (marmara.exe) Marmara'yı açıyor mu?
        shell: pwsh
        run: |
          $dir = (Resolve-Path app/marmara).Path
          & "$dir\marmara.exe" --headless -no-remote -profile "$env:RUNNER_TEMP\marmara-profile2"
          Start-Sleep -Seconds 20
          $running = Get-Process marmara-bin -ErrorAction SilentlyContinue
          if (-not $running) {
            Write-Host "::error::marmara.exe, marmara-bin.exe'yi başlatamadı"
            exit 1
          }
          Write-Host "Başlatıcı çalışıyor."
          $running | Stop-Process -Force

      - name: Son paketi sakla
        uses: actions/upload-artifact@v4
        with:
          name: marmara-windows-final
          path: marmara-*-windows-x86_64.zip
          if-no-files-found: error

  windows-release:
    needs: [update, windows, windows-test]
    timeout-minutes: 10
    if: needs.windows.result == 'success' && needs.windows-test.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: marmara-windows-final

      - name: Release'e ekle
        run: |
          file="marmara-${{ needs.update.outputs.marmara }}-windows-x86_64.zip"
          cp marmara-*-windows-x86_64.zip "$file"
          gh release upload "v${{ needs.update.outputs.marmara }}" "$file" --repo "$GITHUB_REPOSITORY" --clobber
